watchdog_interface:
    battery_topics:
        type: string_array
        read_only: true
        description: A list of topics over which battery messages are being published.
        default_value: [""]

    battery_monitor_configurations:
        __map_battery_topics:
            total_cells:
                type: int
                read_only: true
                description: The number of cells in the given LiPo battery.
                default_value: 0

            cutoff:
                type: double
                read_only: true
                description: The minimum allowable battery percentage.
                default_value: 0.25
                validation:
                    bounds<>: [0.0, 1.0]

            name:
                type: string
                read_only: true
                description: The nickname used by the text-to-speech interface
                default_value: ""
                validation:
                    not_empty<>: null

    pressure_topics:
        type: string_array
        read_only: true
        description: A list of topics over which internal pressure sensor data is published.
        default_value: [""]

    pressure_monitor_configurations:
        __map_pressure_topics:
            minimum_pressure:
                type: double
                default_value: 10.0
                description: "The pressure (PSI) that the bottle is pulled down to when
                    sealed under vacuum. A reading above this indicates that the bottle
                    has lost vacuum (i.e. it is leaking)."

            name:
                type: string
                read_only: true
                description: The nickname used by the text-to-speech interface
                default_value: ""
                validation:
                    not_empty<>: null
