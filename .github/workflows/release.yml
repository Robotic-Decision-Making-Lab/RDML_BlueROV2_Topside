name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify tag matches project versions
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib
          import xml.etree.ElementTree as ET

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag

          versions = {
              "pyproject.toml": tomllib.loads(
                  pathlib.Path("pyproject.toml").read_text()
              )["project"]["version"]
          }
          for manifest in sorted(pathlib.Path("ros").glob("*/package.xml")):
              versions[str(manifest)] = ET.parse(manifest).find("version").text.strip()

          mismatched = {f: v for f, v in versions.items() if v != expected}
          for f, v in mismatched.items():
              print(f"::error file={f}::Tag {tag} does not match version {v} in {f}")
          sys.exit(1 if mismatched else 0)
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag ${prerelease}
